[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-todo-notes"
version = "0.3.0"
description = "Desktop sticky notes and a shared local task CLI for Linux, Windows and macOS"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6,<7", "tzdata>=2024.1"]

[project.scripts]
todo-notes = "todo_notes.__main__:main"
linux-todo-notes = "todo_notes.__main__:main"

[project.gui-scripts]
todo-notes-desktop = "todo_notes.__main__:desktop_main"

[tool.setuptools.packages.find]
include = ["todo_notes*"]
