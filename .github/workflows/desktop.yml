name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: windows-x86_64
            os: windows-latest
          - target: macos-arm64
            os: macos-15
          - target: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
      - name: Install app and build tools
        run: python -m pip install . pyinstaller
      - name: Test persistence, GUI, CLI and single instance
        run: python -m unittest discover -s tests -v
      - name: Build native desktop package
        run: python scripts/build-desktop.py
      - name: Check frozen CLI and GUI startup
        run: python scripts/smoke-frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: TodoNotes-${{ matrix.target }}
          path: dist/TodoNotes-*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: TodoNotes-*
          merge-multiple: true
      - name: Publish release assets after every native build passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/TodoNotes-* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
